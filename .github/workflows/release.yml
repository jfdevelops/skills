name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # changesets/action neither versions nor publishes while only empty changesets are
      # pending, and every tooling PR adds one. They carry no releases, so drop them here.
      - name: Drop empty changesets
        run: |
          for file in .changeset/*.md; do
            if [ "$(basename "$file")" != README.md ] && [ "$(sed -n 2p "$file")" = "---" ]; then
              rm "$file"
            fi
          done
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
